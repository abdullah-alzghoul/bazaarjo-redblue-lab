[default]
host = vm2-siem

# Remote Syslog Receiver (UDP 514) from VM1
[udp://514]
connection_host = ip
sourcetype = syslog
index = main

# Local Apache Access Log Monitoring (Fallback / Direct Monitor)
[monitor:///var/log/apache2/vulnerable-app-access.log]
disabled = false
sourcetype = access_combined
index = main

# Local Apache Error Log Monitoring
[monitor:///var/log/apache2/error.log]
disabled = false
sourcetype = apache_error
index = main

# Local Splunk Internal Audit Logs
[monitor:///opt/splunk/var/log/splunk/splunkd.log]
disabled = false
sourcetype = splunkd
index = _internal
