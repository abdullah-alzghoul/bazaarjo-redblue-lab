<VirtualHost *:80>
    ServerName bazaarjo.lab
    DocumentRoot /var/www/html/vulnerable-app

    WSGIDaemonProcess vulnerableapp user=www-data group=www-data threads=5
    WSGIScriptAlias / /var/www/html/vulnerable-app/vulnerable-app.wsgi

    <Directory /var/www/html/vulnerable-app>
        WSGIProcessGroup vulnerableapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bazaarjo_error.log
    CustomLog ${APACHE_LOG_DIR}/bazaarjo_access.log combined
</VirtualHost>
